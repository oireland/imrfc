name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  postgres:
    # Tests that need real lock contention, which PGlite's single connection can't produce.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: imrfc
          POSTGRES_PASSWORD: imrfc
          POSTGRES_DB: imrfc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imrfc"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://imrfc:imrfc@localhost:5432/imrfc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg

  e2e:
    # One Playwright test per slice's main flow, on a phone viewport, against `next dev` and real Postgres.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: imrfc
          POSTGRES_PASSWORD: imrfc
          POSTGRES_DB: imrfc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imrfc"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      # The few specs that sign in by magic link read the email from here.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # The test database is dropped and rebuilt by Playwright's global setup.
      E2E_DATABASE_URL: postgres://imrfc:imrfc@localhost:5432/imrfc_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec next typegen
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
