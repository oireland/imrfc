services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: imrfc
      POSTGRES_PASSWORD: imrfc
      POSTGRES_DB: imrfc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imrfc"]
      interval: 2s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  postgres-data:
